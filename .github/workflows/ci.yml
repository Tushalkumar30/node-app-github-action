name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: node-app:test

      - name: Run Docker container
        run: |
          docker run -d \
            --name node-app-test \
            -p 8080:8080 \
            node-app:test

      - name: Test running container
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker logs node-app-test

      - name: Stop Docker container
        if: always()
        run: docker rm -f node-app-test